<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find Your Seat | Chathura & Samadhi</title>

    <!-- Open Graph Tags for WhatsApp / Facebook Sharing -->
    <meta property="og:title" content="Find Your Seat | Chathura & Samadhi">
    <meta property="og:description"
        content="We can't wait to celebrate with you at The Lakeside! Enter your name to find your table and seat number for the reception.">
    <meta property="og:image"
        content="https://images.unsplash.com/photo-1519225421980-715cb02151ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
    <meta property="og:type" content="website">

    <!-- IMPORTANT: Replace this with your actual GitHub Pages URL before sharing -->
    <meta property="og:url" content="https://yourusername.github.io/wedding-seating/">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-text: #2b2b2b;
            --accent-color: #8c734b;
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --border-color: #eaddcf;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: radial-gradient(#f0ebe1 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--primary-text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 50px 30px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid var(--accent-color);
            opacity: 0.5;
        }

        .container::before {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .container::after {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        .monogram {
            font-family: 'Great Vibes', cursive;
            font-size: 36px;
            color: var(--accent-color);
            margin-bottom: 10px;
            line-height: 1;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 28px;
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-color);
            margin-bottom: 35px;
        }

        .instructions {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 14px;
            font-weight: 300;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            z-index: 2;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px !important;
            border: 1px solid #ddd;
            border-radius: 2px;
            transition: all 0.3s ease;
            background-color: #faf9f7;
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(140, 115, 75, 0.1);
            background-color: #fff;
        }

        input::placeholder {
            color: #bbb;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        .result-card {
            padding: 30px 20px;
            margin-top: 20px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            display: none;
            animation: fadeIn 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .result-card h3 {
            font-family: 'Great Vibes', cursive;
            font-size: 34px;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--primary-text);
            font-weight: 400;
        }

        .detail-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 15px 0;
        }

        .detail-box {
            text-align: center;
        }

        .detail-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 8px;
        }

        .detail-value {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--accent-color);
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: var(--accent-color);
            margin: 25px auto;
            opacity: 0.5;
        }

        .not-found,
        .loading {
            display: none;
            color: #888;
            font-size: 13px;
            margin-top: 20px;
            padding: 15px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
            animation: fadeIn 0.4s ease;
        }

        .coordinator-prompt {
            color: var(--accent-color);
            font-weight: 500;
            margin-top: 10px;
            font-style: normal;
        }

        /* Suggestions Styling */
        .suggestions-container {
            margin-top: 15px;
            text-align: left;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .suggestions-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-align: center;
        }

        .suggestion-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #faf9f7;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--primary-text);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .suggestion-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="monogram">C & S</div>
        <h1>Chathura & Samadhi</h1>
        <div class="subtitle">August 23, 2026 • The Lakeside</div>

        <div class="divider"></div>

        <p class="instructions" id="dynamicWelcome">
            With joyful hearts, we await your presence.<br>
            Please enter your name below to find your seat.
        </p>

        <div class="input-group">
            <input type="text" id="searchName" placeholder="Enter your first or last name..." oninput="handleTyping()"
                autocomplete="off">
        </div>

        <div id="loading" class="loading">Locating guest list...</div>

        <div id="result" class="result-card">
            <h3 id="guestNameDisplay"></h3>
            <div class="detail-row">
                <div class="detail-box">
                    <div class="detail-label">Table</div>
                    <div class="detail-value" id="tableDisplay"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Seat</div>
                    <div class="detail-value" id="seatDisplay"></div>
                </div>
            </div>
        </div>

        <div id="notFound" class="not-found">
            <div id="notFoundMessage">We couldn't find a perfect match.</div>
            <div id="suggestionsArea" class="suggestions-container" style="display: none;">
                <div class="suggestions-title">Did you mean?</div>
                <div id="suggestionsList"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Dynamic Welcome Text Logic ---
        const welcomeElement = document.getElementById('dynamicWelcome');
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth() + 1;
        const day = today.getDate();

        if (year === 2026 && month === 8 && day === 23) {
            welcomeElement.innerHTML = "Welcome to The Lakeside!<br>Please enter your name below to find your seat for the reception.";
        } else if (year < 2026 || (year === 2026 && month < 8) || (year === 2026 && month === 8 && day < 23)) {
            welcomeElement.innerHTML = "With joyful hearts, we eagerly await your presence.<br>You can preview your reception seating below.";
        } else {
            welcomeElement.innerHTML = "Thank you for celebrating with us!<br>You can look up your reception seating below.";
        }

        // --- Google Sheets Fetch Logic (Real-time Apps Script API) ---
        const apiUrl = 'https://script.google.com/macros/s/AKfycbzzuKAF3Zm3-rr2RuNdbgdcxmsD5BZZkW_2PJe7zduA7nvrgiIRQIIGCOIK1LrOC6eqRQ/exec';

        let guestData = [];

        document.getElementById('loading').style.display = 'block';

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                guestData = data;
            })
            .catch(error => {
                console.error(error);
                document.getElementById('loading').innerText = "Unable to load guest list. Please refresh the page.";
            });

        // --- Debouncing (Wait to stop typing) ---
        let typingTimer;
        const doneTypingInterval = 400;

        function handleTyping() {
            clearTimeout(typingTimer);
            const query = document.getElementById('searchName').value.trim();

            if (query.length >= 3) {
                typingTimer = setTimeout(findSeat, doneTypingInterval);
            } else {
                document.getElementById('result').style.display = 'none';
                document.getElementById('notFound').style.display = 'none';
            }
        }

        // --- Fuzzy Matching (Levenshtein Distance) ---
        function getEditDistance(a, b) {
            if (a.length == 0) return b.length;
            if (b.length == 0) return a.length;
            var matrix = [];
            for (var i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (var j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (var i = 1; i <= b.length; i++) {
                for (var j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) == a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        // --- Smart Search Logic ---
        function findSeat() {
            const query = document.getElementById('searchName').value.toLowerCase().trim();
            const resultDiv = document.getElementById('result');
            const notFoundDiv = document.getElementById('notFound');
            const suggestionsArea = document.getElementById('suggestionsArea');
            const suggestionsList = document.getElementById('suggestionsList');
            const notFoundMessage = document.getElementById('notFoundMessage');

            // 1. Check for an EXACT match with a full name in the spreadsheet
            const exactMatch = guestData.find(guest => guest.name.toLowerCase() === query);

            if (exactMatch) {
                showMatch(exactMatch);
                return;
            }

            // 2. Find ALL partial matches. 
            // We no longer auto-show if there is only 1 partial match. They MUST click the suggestion.
            const partialMatches = guestData.filter(guest => guest.name.toLowerCase().includes(query));

            // 3. Build suggestions list
            let validSuggestions = [];

            if (partialMatches.length > 0) {
                // Even if there is just 1 partial match, show it as a suggestion
                validSuggestions = partialMatches.map(guest => ({ guest: guest, distance: 0 }));
            } else {
                // No partial matches at all. Use the strict typo logic.
                const maxAllowedTypos = query.length <= 4 ? 1 : 2;

                guestData.forEach(guest => {
                    const guestNameLower = guest.name.toLowerCase();
                    const nameParts = guestNameLower.split(' ');

                    let bestDistance = getEditDistance(query, guestNameLower);

                    nameParts.forEach(part => {
                        const dist = getEditDistance(query, part);
                        if (dist < bestDistance) bestDistance = dist;
                    });

                    if (bestDistance <= maxAllowedTypos) {
                        validSuggestions.push({ guest, distance: bestDistance });
                    }
                });

                validSuggestions.sort((a, b) => a.distance - b.distance);
            }

            // Cap suggestions at 4 to keep the UI clean
            validSuggestions = validSuggestions.slice(0, 4);

            if (validSuggestions.length > 0) {
                resultDiv.style.display = 'none';
                notFoundDiv.style.display = 'block';
                suggestionsList.innerHTML = '';

                // Apply the coordinator prompt if there are 2 or more similar names
                if (validSuggestions.length >= 2) {
                    notFoundMessage.innerHTML = "Multiple similar names found.<br><div class='coordinator-prompt'>Please check with the coordinators for support.</div>";
                } else {
                    notFoundMessage.innerText = "Did you mean this guest?";
                }

                validSuggestions.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'suggestion-btn';
                    btn.innerText = item.guest.name;
                    btn.onclick = function () {
                        // Clicking the button fills the input with the exact name, triggering an exact match on the next search
                        document.getElementById('searchName').value = item.guest.name;
                        findSeat();
                    };
                    suggestionsList.appendChild(btn);
                });
                suggestionsArea.style.display = 'block';
            } else {
                resultDiv.style.display = 'none';
                notFoundDiv.style.display = 'block';
                suggestionsArea.style.display = 'none';
                notFoundMessage.innerHTML = "We couldn't find a perfect match.<br><div class='coordinator-prompt'>Please check with the coordinators for support.</div>";
            }
        }

        // Helper function to display the final result
        function showMatch(match) {
            document.getElementById('guestNameDisplay').innerText = match.name;
            document.getElementById('tableDisplay').innerText = match.table;
            document.getElementById('seatDisplay').innerText = match.seat;

            document.getElementById('result').style.display = 'block';
            document.getElementById('notFound').style.display = 'none';
        }
    </script>

</body>

</html>
